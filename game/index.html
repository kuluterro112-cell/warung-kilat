<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warung Kilat</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f08; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; background: #1a0f08; touch-action: none; }
    #msg {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      padding: 24px; text-align: center; color: #ffe7b8;
      font: bold 22px Arial, sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="msg">Warung Kilat memakai modul JavaScript. Jalankan lewat server lokal (serve.ts) agar modul bisa dimuat.</div>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('msg').style.display = 'flex';
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
